appId: com.xrpl.command-center
productName: XRPL Command Center
copyright: Copyright © 2026 XRPL Command Center Contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - "!node_modules/three/**"
  - "!node_modules/xrpl/**"
  - "!node_modules/ripple-binary-codec/**"
  - "!node_modules/ripple-keypairs/**"
  - "!node_modules/ripple-address-codec/**"
  - "!node_modules/lucide-react/**"
  - "!node_modules/react/**"
  - "!node_modules/react-dom/**"
  - "!node_modules/qrcode/**"
  - "!node_modules/zustand/**"
  - "!node_modules/@noble/**"
  - "!node_modules/@xrplf/**"
  - "!node_modules/**/*.map"
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/README*"
  - "!node_modules/**/CHANGELOG*"
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/bin
    to: bin
asar: true
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
electronLanguages:
  - en-US
compression: maximum
linux:
  category: Network;Development;Utility
  icon: build/icons
  desktop:
    Name: XRPL Command Center
    Comment: Real-Time XRP Ledger Command Center, Rust Vault & Node Ops
    StartupWMClass: xrpl-command-center
    Icon: xrpl-command-center
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: XRPL-Command-Center-${version}-linux-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: XRPL-Command-Center-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: XRPL-Command-Center-${version}-win-${arch}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: XRPL-Command-Center-${version}-mac-${arch}.${ext}
