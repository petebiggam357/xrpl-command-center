appId: com.xrpl.command-center
productName: XRPL Command Center
copyright: Copyright © 2026 XRPL Command Center Contributors
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: build/icon.png
    to: icon.png
  - from: build/bin
    to: bin
asar: true
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
compression: normal
linux:
  category: Network;Development;Utility
  icon: build/icons
  desktop:
    Name: XRPL Command Center
    Comment: Real-Time XRP Ledger Command Center, Rust Vault & Node Ops
    StartupWMClass: xrpl-command-center
    Icon: xrpl-command-center
  target:
    - target: AppImage
      arch:
        - x64
  artifactName: XRPL-Command-Center-${version}-linux-${arch}.${ext}
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: XRPL-Command-Center-${version}-win-${arch}-setup.${ext}
portable:
  artifactName: XRPL-Command-Center-${version}-win-${arch}-portable.${ext}
mac:
  category: public.app-category.developer-tools
  icon: build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
  artifactName: XRPL-Command-Center-${version}-mac-${arch}.${ext}
