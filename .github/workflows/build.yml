name: Build Cross-Platform Packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cargo test --manifest-path rust-vault/Cargo.toml
      - run: npm run build:rust
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  package:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cmd: npm run dist:linux
            artifact: linux-appimage
          - os: windows-latest
            cmd: npm run dist:win
            artifact: windows-exe
          - os: macos-latest
            cmd: npm run dist:mac
            artifact: macos-dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build:rust
      - run: ${{ matrix.cmd }}
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release
          if [ "${{ runner.os }}" = "Linux" ]; then
            sha256sum *.AppImage > SHA256SUMS-linux.txt
          elif [ "${{ runner.os }}" = "macOS" ]; then
            shasum -a 256 *.dmg > SHA256SUMS-mac.txt
          else
            sha256sum *.exe > SHA256SUMS-win.txt
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/SHA256SUMS-*.txt
          if-no-files-found: error
      - name: Attach binaries to GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          files: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/SHA256SUMS-*.txt
